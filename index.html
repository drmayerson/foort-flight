<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOORT Flight</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./game.css">
</head>
<body class="game">
<div id="stage">
  <canvas id="view" tabindex="0" aria-label="the view from the ship"></canvas>
  <pre id="hud" aria-live="off"></pre>
  <div id="credit" class="muted"></div>
  <div id="help" class="overlay" hidden></div>
  <div id="fatal" class="overlay" hidden></div>
</div>
<aside id="side">
  <header>
    <h1>FOORT Flight</h1>
    <div class="row"><button id="helpBtn" title="help (?)">?</button><button id="restart" title="back to the start position">Start position</button><button id="share">Copy link</button><span id="shareNote" class="muted"></span></div>
  </header>
  <div id="panel"></div>
  <footer class="muted">
    <p>Light rays traced in real time on your GPU, after <a href="https://drmayerson.github.io/foort-gpu/">FOORT-GPU</a>. Free mode (milestone G4); the physical spaceship follows.</p>
    <p><a href="./about.html">About and test pages</a> · <button id="reset" class="link">Reset all settings</button></p>
  </footer>
</aside>
<script type="module" src="./js/main.js"></script>
</body>
</html>
